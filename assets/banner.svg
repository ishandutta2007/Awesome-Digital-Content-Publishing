<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>
  </defs>

  <style>
    .pulse-glow {
      animation: pulse 6s ease-in-out infinite alternate;
    }
    .float-card1 {
      animation: floatSlow 7s ease-in-out infinite alternate;
    }
    .float-card2 {
      animation: floatReverse 8s ease-in-out infinite alternate;
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: dashMove 20s linear infinite;
    }
    .pill-wave {
      animation: pillPulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.55; transform: scale(1.05); }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatReverse {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -1000; }
    }
    @keyframes pillPulse {
      0% { filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.3)); }
      100% { filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.7)); }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows in Background -->
  <g class="pulse-glow" style="transform-origin: 250px 180px;">
    <circle cx="250" cy="180" r="160" fill="url(#glow-grad)" filter="url(#soft-glow)" />
    <circle cx="950" cy="140" r="140" fill="#38bdf8" opacity="0.12" filter="url(#soft-glow)" />
  </g>

  <!-- Dynamic Background Grid / Architecture Circuit Lines -->
  <g opacity="0.18">
    <path d="M 0 90 L 1200 90 M 0 180 L 1200 180 M 0 270 L 1200 270" stroke="#334155" stroke-width="1" />
    <path d="M 200 0 L 200 360 M 450 0 L 450 360 M 750 0 L 750 360 M 1000 0 L 1000 360" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Animated Connection Stream in Background (Non-blocking) -->
  <path class="flow-dash" d="M 60 40 Q 300 20 500 70 T 900 50 T 1140 100" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path class="flow-dash" d="M 40 320 Q 350 340 650 300 T 1160 310" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />

  <!-- Subtle Dynamic Tech Cards in Ambient Background (Far sides, clear of text) -->
  <g class="float-card1" opacity="0.5">
    <!-- Left Decorative Card -->
    <rect x="40" y="80" width="130" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="60" cy="105" r="5" fill="#38bdf8" />
    <rect x="75" y="101" width="70" height="8" rx="4" fill="#475569" />
    <rect x="60" y="123" width="85" height="6" rx="3" fill="#334155" />
  </g>

  <g class="float-card2" opacity="0.5">
    <!-- Right Decorative Card -->
    <rect x="1030" y="210" width="130" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="1050" cy="235" r="5" fill="#34d399" />
    <rect x="1065" y="231" width="70" height="8" rx="4" fill="#475569" />
    <rect x="1050" y="253" width="85" height="6" rx="3" fill="#334155" />
  </g>

  <!-- MAIN FOREGROUND CONTENT (Guaranteed Clear & Legible) -->
  <g>
    <!-- Top Category Pill -->
    <g class="pill-wave">
      <rect x="430" y="38" width="340" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
      <text x="600" y="58" fill="#a5b4fc" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        CURATED SAAS &amp; OPEN SOURCE ECOSYSTEM
      </text>
    </g>

    <!-- Main Title: Awesome Digital Content Publishing -->
    <text x="600" y="132" fill="url(#primary-grad)" font-size="44" font-weight="900" letter-spacing="-1" text-anchor="middle" filter="url(#glow)">
      Awesome Digital Content Publishing
    </text>

    <!-- Subtitle: High-clarity description -->
    <text x="600" y="174" fill="#f8fafc" font-size="18" font-weight="600" letter-spacing="0.2" text-anchor="middle">
      Headless CMS • Managed WordPress • Creator Platforms • Publishing Engines
    </text>

    <text x="600" y="202" fill="#94a3b8" font-size="14" font-weight="400" text-anchor="middle">
      Comprehensive market guide covering enterprise SaaS, transparent pricing, scale analysis &amp; self-hosted frameworks
    </text>

    <!-- Feature Attribute Pills / Tags in Foreground -->
    <g transform="translate(185, 245)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <circle cx="20" cy="18" r="4" fill="#38bdf8" />
        <text x="98" y="23" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Headless &amp; API-First</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect x="0" y="0" width="180" height="36" rx="18" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <circle cx="20" cy="18" r="4" fill="#818cf8" />
        <text x="98" y="23" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Verified SaaS Pricing</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="200" height="36" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
        <circle cx="20" cy="18" r="4" fill="#34d399" />
        <text x="108" y="23" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Self-Hosted Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(605, 0)">
        <rect x="0" y="0" width="210" height="36" rx="18" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" opacity="0.9" />
        <circle cx="20" cy="18" r="4" fill="#f43f5e" />
        <text x="113" y="23" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle">Company Scale Analytics</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <text x="600" y="325" fill="#64748b" font-size="12" font-weight="500" letter-spacing="0.5" text-anchor="middle">
      ⚡ Actively Maintained • Star History Tracked • Community Curated • Updated for 2026
    </text>
  </g>
</svg>
